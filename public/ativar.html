<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Ativar credencial | Assinator2000
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <main class="pagina-login">

        <section class="painel-login">

            <div class="marca">

                <div class="marca-icone">
                    A2K
                </div>

                <div>

                    <h1>
                        Assinator2000
                    </h1>

                    <p>
                        Ativação da credencial pessoal
                    </p>

                </div>

            </div>


            <div class="conteudo-login">

                <div class="cabecalho-login">

                    <span class="etiqueta">
                        Primeiro acesso
                    </span>

                    <h2>
                        Crie seu PIN pessoal
                    </h2>

                    <p>
                        Informe o usuário e o código
                        temporário recebido. Depois escolha
                        um PIN pessoal de 6 dígitos.
                    </p>

                </div>


                <form
                    id="formAtivacao"
                    class="form-login"
                    novalidate
                >

                    <div class="campo">

                        <label for="usuario">
                            Usuário
                        </label>

                        <input
                            id="usuario"
                            type="text"
                            placeholder="nome.sobrenome"
                            autocomplete="username"
                            autocapitalize="none"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="codigo">
                            Código temporário
                        </label>

                        <input
                            id="codigo"
                            type="password"
                            placeholder="8 dígitos"
                            inputmode="numeric"
                            maxlength="8"
                            autocomplete="one-time-code"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="pin">
                            Novo PIN
                        </label>

                        <input
                            id="pin"
                            type="password"
                            placeholder="6 dígitos"
                            inputmode="numeric"
                            maxlength="6"
                            autocomplete="new-password"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="confirmarPin">
                            Confirme o PIN
                        </label>

                        <input
                            id="confirmarPin"
                            type="password"
                            placeholder="Digite novamente"
                            inputmode="numeric"
                            maxlength="6"
                            autocomplete="new-password"
                            required
                        >

                    </div>


                    <div
                        id="mensagem"
                        class="mensagem"
                        role="alert"
                        aria-live="polite"
                    ></div>


                    <button
                        id="botaoAtivar"
                        class="botao-entrar"
                        type="submit"
                    >
                        Criar PIN pessoal
                    </button>


                    <a
                        href="/"
                        class="link-ativacao"
                    >
                        Voltar para o login
                    </a>

                </form>

            </div>

        </section>

    </main>


    <script src="js/ativar.js"></script>

</body>

</html>
